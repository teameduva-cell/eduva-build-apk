name: eduva
description: "EDUVA: Student-First AI Powered Learning Platform"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Functional Error Handling
  dartz: ^0.10.1

  # Value Equality
  equatable: ^2.0.5

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8

  # Cupertino Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Uncomment when assets are added.
  # assets:
  #   - assets/images/
  #   - assets/icons/